name: Build and deploy to GitHub Pages

# Manual trigger only until the DNS cutover is approved, so a content edit cannot publish
# the site before anyone has looked at it. After cutover, uncomment the push trigger and
# Tina's saves-to-main will deploy by themselves.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, and never cancel one halfway.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A step's `if` cannot read `secrets` — that context is not available there, which is
    # what "Unrecognized named-value: 'secrets'" means. Job-level `env` can read secrets,
    # and `if` can read `env`, so the Tina check goes through here.
    env:
      TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Skipped until Tina Cloud is set up, so the first deploy is not blocked on it. The
      # site builds and serves fine without the admin; /admin just will not exist yet.
      - name: Build the Tina admin
        if: ${{ env.TINA_CLIENT_ID != '' }}
        run: npx tinacms build
        env:
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          NEXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          # Measured: this step OOMs at a 1GB heap and passes at 2GB, which is close enough
          # to a runner's default to be worth stating explicitly.
          NODE_OPTIONS: --max-old-space-size=4096

      # Gavin uploads photos through Tina, which commits the originals to public/uploads
      # with no responsive variants. Generating them here means an uploaded phone photo is
      # optimised in the deployed site without anyone remembering to run a script. Variants
      # stay committed too, so local builds and a fresh clone need nothing.
      - name: Generate responsive image variants
        run: node scripts/build-responsive-images.mjs

      - name: Build the site
        run: npm run build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
          PUBLIC_GA4_ID: ${{ secrets.GA4_ID }}

      # Cheap gate: a type error should stop a deploy, not land on the live site.
      - name: Type check
        run: npx astro check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
